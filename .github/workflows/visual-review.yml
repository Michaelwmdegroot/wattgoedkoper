name: Premium visual and interaction review

on:
  push:
    branches: [main, design/premium-energy-house]
  pull_request:

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check calculation and module syntax
        run: |
          npm test
          npm run check
      - name: Build editorial pages and standalone preview
        run: |
          python3 scripts/build-content.py
          python3 scripts/build-preview.py
      - name: Verify crawlable content and internal links
        run: npm run check:seo
      - name: Review real browser behavior and capture evidence
        run: node scripts/visual-review.cjs
      - name: Verify v0.5 plan, advice and admin viewports
        run: node scripts/visual-review-v05.cjs
      - name: Review interactive Plan Studio, clipping, variants and accessibility
        run: node scripts/plan-studio-review.cjs
      - name: Review dashboard 2.0 navigation, status honesty and viewport screenshots
        run: node scripts/admin-dashboard-review.cjs
      - name: Verify first-viewport energy home and five visible measures
        run: node scripts/home-cockpit-review.cjs
      - name: Verify brand assets, homepage guidance and responsive layout
        run: node scripts/brand-home-review.cjs
      - name: Review editorial journeys, example engine and responsive layouts
        run: node scripts/seo-browser-review.cjs
      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-visual-review
          retention-days: 14
          if-no-files-found: warn
          path: |
            visual-review-output/
            preview/wattgoedkoper-preview.html
