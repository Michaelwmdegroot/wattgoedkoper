name: One-time sync home-cockpit offline preview
on:
  push:
    branches:
      - feat/home-cockpit-one-screen-v06

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Rebuild tracked offline preview from current source
        run: python3 scripts/build-preview.py
      - name: Commit preview only to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview/wattgoedkoper-preview.html
          if git diff --cached --quiet; then
            echo "Preview is already synchronized."
            exit 0
          fi
          git commit -m "build(preview): synchronize v0.6 first-screen energy home"
          git push origin HEAD:feat/home-cockpit-one-screen-v06
