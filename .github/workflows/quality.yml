name: Calculation and data safety checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, openssl
          coverage: none
      - run: npm test
      - run: npm run check
      - run: python3 tests/backend_test.py --php php
      - name: Check PHP syntax
        run: find api lib scripts -name '*.php' -print0 | xargs -0 -n1 php -l
