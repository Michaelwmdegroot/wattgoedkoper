name: Calculation and data safety checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-root
          MYSQL_DATABASE: wattgoedkoper_ci
          MYSQL_USER: wattgoedkoper_ci
          MYSQL_PASSWORD: ci-password-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, openssl, sodium
          coverage: none
      - run: npm test
      - run: npm run check
      - name: Verify live smoke fingerprint locally without external requests
        run: node --check scripts/live-deployment-smoke.mjs && node scripts/live-deployment-smoke.mjs --self-test
      - name: Build and validate SEO publication
        run: |
          python3 scripts/build-content.py
          npm run check:seo
      - run: python3 tests/backend_test.py --php php
      - run: php tests/mail_safety_test.php
      - run: php tests/report_mail_test.php
      - name: Verify report-only readiness flag is private and does not send mail
        run: php tests/report_preflight_test.php
      - name: Verify NIVO delivery outbox, receipts, retry and consent without network
        run: php tests/delivery_test.php
      - name: Verify read-only Hostinger backup prerequisite check with synthetic fixtures
        run: php tests/backup_preflight_test.php
      - name: Verify authenticated recovery archive and isolated extraction with fictitious data
        run: php tests/backup_test.php
      - name: Validate safe interactive backup wrapper syntax
        run: bash -n scripts/backup-safe.sh
      - name: Verify single private maintenance runner, heartbeat, lock and alerts
        run: php tests/operations_test.php
      - name: Verify Hostinger installer without PHP system function
        env:
          WG_TEST_MYSQL_NAME: wattgoedkoper_ci
          WG_TEST_MYSQL_USER: wattgoedkoper_ci
          WG_TEST_MYSQL_PASSWORD: ci-password-not-a-secret
        run: python3 tests/setup_mysql_cli_test.py
      - name: Verify MySQL integration on ephemeral CI database
        env:
          WG_TEST_MYSQL_NAME: wattgoedkoper_ci
          WG_TEST_MYSQL_USER: wattgoedkoper_ci
          WG_TEST_MYSQL_PASSWORD: ci-password-not-a-secret
        run: php tests/mysql_backend_test.php
      - name: Ensure MySQL client CLI is available for isolated restore simulation
        run: |
          if ! command -v mysqldump >/dev/null 2>&1 || ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq default-mysql-client
          fi
      - name: Verify real MySQL export to encrypted bundle and isolated import using CI-only data
        env:
          WG_TEST_MYSQL_NAME: wattgoedkoper_ci
          WG_TEST_MYSQL_USER: wattgoedkoper_ci
          WG_TEST_MYSQL_PASSWORD: ci-password-not-a-secret
          WG_TEST_MYSQL_ROOT_PASSWORD: local-ci-root
        run: php tests/backup_mysql_roundtrip_test.php
      - name: Verify SELECT-only production observer using isolated CI MySQL
        env:
          WG_TEST_MYSQL_NAME: wattgoedkoper_ci
          WG_TEST_MYSQL_USER: wattgoedkoper_ci
          WG_TEST_MYSQL_PASSWORD: ci-password-not-a-secret
        run: php tests/ops_readonly_test.php
      - name: Check PHP syntax
        run: find api lib scripts -name '*.php' -print0 | xargs -0 -n1 php -l
