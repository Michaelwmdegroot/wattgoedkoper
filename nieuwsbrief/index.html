<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <title>E-mailvoorkeur bevestigen of afmelden | WattGoedkoper</title>
  <link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
  <script type="module" src="/assets/newsletter-choice.mjs"></script>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#edf1ea;color:#173f49;font-family:system-ui,-apple-system,sans-serif}
    main{width:min(100%,510px);background:#fffefa;border:1px solid #e0e7d9;border-radius:22px;padding:34px;box-shadow:0 20px 65px #1b3d4517}
    .brand{display:block;margin:0 0 32px;width:180px;max-width:100%}
    .eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;color:#5b735d;text-transform:uppercase}
    h1{font:400 clamp(26px,6vw,36px)/1.15 Georgia,serif;margin:14px 0 18px}
    p{font-size:15px;line-height:1.7;color:#52665b}
    button{display:block;width:100%;border:0;border-radius:11px;min-height:49px;padding:13px 18px;background:#ffda4a;color:#173f49;font-weight:750;font-size:14px;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #choice-error{color:#a23c30}
    footer{display:flex;justify-content:space-between;gap:16px;margin-top:30px;font-size:12px;flex-wrap:wrap}
    a{color:#305f4a;text-underline-offset:3px}
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="WattGoedkoper startpagina"><img src="/assets/brand-logo.svg" width="180" height="40" alt="WattGoedkoper" class="brand"></a>
    <span class="eyebrow">JIJ BEPAALT WAT JE ONTVANGT</span>
    <h1 id="choice-title">Je e-mailvoorkeur.</h1>
    <p id="choice-text">We controleren je link. Zonder jouw bevestiging wordt je e-mailadres niet voor commerciële e-mails gebruikt.</p>
    <button id="choice-button" type="button" hidden>Bevestig mijn keuze</button>
    <p id="choice-error" role="alert" hidden></p>
    <p id="choice-result" role="status" hidden></p>
    <footer><a href="/">Terug naar je energiehuis</a><a href="/privacy.html">Privacy &amp; contact</a></footer>
  </main>
</body>
</html>
